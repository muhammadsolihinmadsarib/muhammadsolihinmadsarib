name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Updates every day at midnight
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: "" # This removes the default header so only the calendar shows
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year # Displays last 6 months
          config_timezone: Asia/Kuala Lumpur
