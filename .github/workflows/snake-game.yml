# .github/workflows/snake-game.yml
name: Generate Snake Game Contribution Graph

on:
  schedule:
    # Runs every day at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Generate Snake contribution graph
      - name: Generate snake-contribution-graph.svg
        uses: abozanona/snake-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Optional parameters:
          # theme: github_dark
          # stroke_width: 5

      # Step 3: Publish to output branch
      - name: Publish graph to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
